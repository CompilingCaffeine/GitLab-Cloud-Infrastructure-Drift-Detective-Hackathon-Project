# Cloud Infrastructure Drift Detective
#
# Pipelines:
#   merge request  -> fmt, validate, tests, plan + policy guardrails (read-only identity)
#   main branch    -> the same, then a MANUAL apply (write identity), then verify (no drift
#                     remains) and close the drift issue the merged MR came from
#   drift check    -> scheduled (or run with DRIFT_CHECK=true): plan against the live
#                     environment, publish redacted evidence, open a drift issue, and start
#                     the GitLab Duo investigator flow, which proposes a fix as a merge request

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid duplicate branch pipelines while an MR is open.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH

include:
  # GitLab security scanners: IaC misconfigurations (KICS) and leaked secrets.
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - secure
  - plan
  - apply
  - verify
  - drift
  - investigate

variables:
  # Non-secret outputs of bootstrap/ (identities, not credentials).
  GCP_WIF_PROVIDER: projects/860356597681/locations/global/workloadIdentityPools/gitlab-ci/providers/gitlab-com
  GCP_PLAN_SA: drift-plan@drift-detective-2026.iam.gserviceaccount.com
  GCP_APPLY_SA: drift-apply@drift-detective-2026.iam.gserviceaccount.com
  # gitlab-tofu wrapper: GitLab-managed state named "demo", config in terraform/.
  GITLAB_TOFU_ROOT_DIR: ${CI_PROJECT_DIR}/terraform
  GITLAB_TOFU_STATE_NAME: demo
  # Plans skip the state lock (-lock=false): pipelines started by the Duo flow's service account
  # (Developer role) may read but not lock state. Plans never write state; apply still locks,
  # and resource_group serializes every job that touches the demo state.
  GITLAB_TOFU_ALLOW_DEVELOPER_ROLE: "true"
  # Full JSON plans can contain secrets: they stay in the job's temp dir, never in artifacts.
  FULL_PLAN: /tmp/full-plan.json
  DRIFT_FLOW_NAME: drift-detective-investigator
  DRIFT_CHECK:
    value: "false"
    description: Set to "true" to run a drift check instead of the normal pipeline.

default:
  image: registry.gitlab.com/components/opentofu/gitlab-opentofu:4.9.0-opentofu1.12.6-alpine
  interruptible: false
  timeout: 15m
  cache:
    key: tofu-${GITLAB_TOFU_STATE_NAME}
    paths:
      - terraform/.terraform/

.gcp:
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://gitlab.com/gitlab-ai-hackathon/transcend-october-2026/33443675/showcase
  before_script:
    - . scripts/gcp-auth.sh

.normal-rules:
  rules:
    - if: $DRIFT_CHECK == "true" || $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.main-rules:
  rules:
    - if: $DRIFT_CHECK == "true" || $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- validate ----------

fmt:
  stage: validate
  extends: .normal-rules
  cache: []
  script:
    - gitlab-tofu fmt

validate:
  stage: validate
  extends: .normal-rules
  script:
    - gitlab-tofu validate

test:
  stage: validate
  extends: .normal-rules
  cache: []
  script:
    - tests/run_tests.sh

# ---------- secure ----------

# The template's base job also needs a stage that exists here (it never runs itself).
iac-sast:
  stage: secure

kics-iac-sast:
  stage: secure
  rules: !reference [.normal-rules, rules]

secret_detection:
  stage: secure
  rules: !reference [.normal-rules, rules]

# ---------- plan ----------

plan:
  stage: plan
  extends: [.gcp, .normal-rules]
  variables:
    GCP_SA: $GCP_PLAN_SA
  resource_group: tofu-demo
  script:
    - gitlab-tofu plan
    - gitlab-tofu show -json "$GITLAB_TOFU_ROOT_DIR/plan.cache" > "$FULL_PLAN"
    - scripts/summarize_plan.sh "$FULL_PLAN" evidence
    - scripts/policy_check.sh "$FULL_PLAN"
  artifacts:
    when: always
    # The plan cache can embed secrets: keep it to project members only.
    access: developer
    expire_in: 7 days
    paths:
      - terraform/plan.cache
      - evidence/
    reports:
      terraform: terraform/plan.json

# ---------- apply (human gate) ----------

apply:
  stage: apply
  extends: [.gcp, .main-rules]
  variables:
    GCP_SA: $GCP_APPLY_SA
  needs: [plan]
  resource_group: tofu-demo
  environment:
    name: demo
    url: https://console.cloud.google.com/run?project=drift-detective-2026
  rules:
    - if: $DRIFT_CHECK == "true" || $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  allow_failure: false
  script:
    - gitlab-tofu apply
    - gitlab-tofu output -json > outputs.json
  artifacts:
    expire_in: 30 days
    paths:
      - outputs.json

# ---------- verify ----------

verify:
  stage: verify
  extends: [.gcp, .main-rules]
  variables:
    GCP_SA: $GCP_PLAN_SA
    GITLAB_TOFU_USE_DETAILED_EXITCODE: "true"
    GITLAB_TOFU_PLAN_NAME: verify
  needs: [apply]
  resource_group: tofu-demo
  script:
    - |
      set +e
      gitlab-tofu plan
      code=$?
      set -e
      gitlab-tofu show -json "$GITLAB_TOFU_ROOT_DIR/verify.cache" > "$FULL_PLAN"
      scripts/summarize_plan.sh "$FULL_PLAN" evidence
      case "$code" in
        0) echo "VERIFIED: live environment matches the declared configuration." ;;
        2) echo "NOT VERIFIED: differences remain after apply." >&2; exit 1 ;;
        *) echo "Plan failed (exit $code)." >&2; exit "$code" ;;
      esac
    - scripts/close_drift_issue.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - evidence/

# ---------- drift detection ----------

detect-drift:
  stage: drift
  extends: .gcp
  variables:
    GCP_SA: $GCP_PLAN_SA
    GITLAB_TOFU_USE_DETAILED_EXITCODE: "true"
    GITLAB_TOFU_PLAN_NAME: drift
  rules:
    - if: ($DRIFT_CHECK == "true" || $CI_PIPELINE_SOURCE == "schedule") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: tofu-demo
  script:
    - |
      set +e
      gitlab-tofu plan
      code=$?
      set -e
      case "$code" in
        0|2) ;;
        *) echo "Plan failed (exit $code); cannot determine drift." >&2; exit "$code" ;;
      esac
      gitlab-tofu show -json "$GITLAB_TOFU_ROOT_DIR/drift.cache" > "$FULL_PLAN"
      # The report is printed to this job log too: the investigator cross-checks the issue against it.
      scripts/summarize_plan.sh "$FULL_PLAN" evidence
      # OUT_OF_SYNC: live environment differs from main (exit 2).
      # DRIFT_DETECTED: the difference includes changes made outside OpenTofu.
      {
        echo "OUT_OF_SYNC=$([ "$code" -eq 2 ] && echo true || echo false)"
        echo "DRIFT_DETECTED=$(jq -r .drift_detected evidence/drift-report.json)"
        echo "DETECT_JOB_ID=$CI_JOB_ID"
      } | tee drift.env
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - evidence/
    reports:
      dotenv: drift.env

# ---------- agentic investigation ----------

investigate:
  stage: investigate
  needs:
    - job: detect-drift
      artifacts: true
  rules:
    - if: ($DRIFT_CHECK == "true" || $CI_PIPELINE_SOURCE == "schedule") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache: []
  timeout: 5m
  script:
    - scripts/start_drift_flow.sh
